name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - name: Check the links in our own documentation (local links and anchors only)
        run: node bin/linkcheck.js --no-config --ignore '^https?://' --format github README.md
